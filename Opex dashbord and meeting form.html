<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Opex Dashboard and Meeting Form</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { font-family: -apple-system, Arial, sans-serif; background:#0f1115; height:100dvh; display:flex; flex-direction:column; }
  .topbar {
    display:flex; align-items:center; justify-content:center;
    padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top));
    background:#181b21; border-bottom:1px solid #262a33; flex-shrink:0;
  }
  .navwrap {
    display:flex; gap:6px; background:#1c2029; border-radius:16px; padding:6px;
    max-width:100%; flex-wrap:wrap; justify-content:center;
  }
  .navbtn {
    appearance:none; border:none; background:transparent; color:#c7ccd6;
    font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px;
    cursor:pointer; transition: background .15s, color .15s; white-space:nowrap; flex-shrink:0;
  }
  .navbtn:hover { color:#fff; }
  .navbtn.active { background:#e8a13b; color:#1a1305; }
  .frame-wrap { flex:1; position:relative; background:#0f1115; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:none; background:#fff; }
  @media (max-width: 640px) {
    .navbtn { font-size:12.5px; padding:8px 13px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="navwrap">
      <button class="navbtn active" data-src="budget-target-dashboard.html">Budget Target Dashboard</button>
      <button class="navbtn" data-src="daily-meeting-form.html">Daily Meeting Form</button>
      <button class="navbtn" data-src="daily-meeting-dashboard.html">Daily Meeting Dashboard</button>
      <button class="navbtn" data-src="all-sbu-organogram.html">All SBU Organogram</button>
    </div>
  </div>
  <div class="frame-wrap">
    <iframe id="viewer" title="content" src="budget-target-dashboard.html"></iframe>
  </div>

  <script>
    const iframe = document.getElementById('viewer');
    const buttons = document.querySelectorAll('.navbtn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        iframe.src = btn.dataset.src;
        buttons.forEach(b => b.classList.toggle('active', b === btn));
      });
    });
  </script>
</body>
</html>
